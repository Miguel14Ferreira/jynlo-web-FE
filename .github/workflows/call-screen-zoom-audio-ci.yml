name: Jynlo call screen zoom and audio mixer

on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check Angular production bundle
        run: npx ng build --configuration production
      - name: Test call overlay and media tile playback
        run: npx ng test --watch=false --browsers=ChromeHeadless --include=src/app/shared/direct-call-overlay.component.spec.ts --include=src/app/shared/call-participant-tile.component.spec.ts
