name: LIVE venue catalogue smoke (read only)

on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  venue-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check public approved venues and detail route
        env:
          VENUES_API_URL: https://api.d24sports.com
        run: python3 scripts/qa_live_venue_catalogue.py
