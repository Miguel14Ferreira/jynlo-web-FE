name: Jynlo voice draft playback regression

on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate message center voice recording and playback
        run: npx ng test --watch=false --browsers=ChromeHeadless --include=src/app/pages/messages-center/messages-center.component.spec.ts
