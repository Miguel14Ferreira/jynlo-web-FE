name: Jynlo auditoria visual (manual, conta QA, só leitura)

# Percorre as páginas principais do site real com a conta QA jynloteste01, em
# telemóvel e computador, e guarda capturas + relatório de problemas de layout.
# Só leitura: não envia mensagens, não submete formulários nem muda dados.
# As capturas mostram apenas o que a conta QA vê e ficam 5 dias no artefacto privado.
on:
  workflow_dispatch:
    inputs:
      conta:
        description: 'Conta QA (1 = jynloteste01 dono, 2 = jynloteste02 membro)'
        type: choice
        options: ['1', '2']
        default: '1'
      idioma:
        description: 'Idioma do site'
        type: choice
        options: [pt, en]
        default: pt

permissions:
  contents: write

concurrency:
  group: jynlo-visual-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_AUDIT_ACCOUNT: ${{ inputs.conta || '1' }}
      JYNLO_AUDIT_LANG: ${{ inputs.idioma || 'pt' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar conta QA autorizada
        run: |
          u="JYNLO_QA_USERNAME_$JYNLO_AUDIT_ACCOUNT"; p="JYNLO_QA_PASSWORD_$JYNLO_AUDIT_ACCOUNT"
          if [ -z "${!p}" ] || [ "${!u}" != "jynloteste0$JYNLO_AUDIT_ACCOUNT" ]; then
            echo '::error::Conta QA em falta ou não autorizada; nenhuma sessão iniciada.'; exit 1
          fi
      - name: Instalar Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund --package-lock=false playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Auditoria
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/qa/visual-audit.cjs
      - name: Guardar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-auditoria-visual
          path: visual-audit/
          retention-days: 5
      - name: Publicar resultados num ramo próprio (qa-audit/run-ID)
        if: always()
        run: |
          [ -d visual-audit ] || exit 0
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image; import glob, os
          for f in glob.glob('visual-audit/screens/*.png'):
              im = Image.open(f).convert('RGB')
              if im.height > 6000: im = im.crop((0, 0, im.width, 6000))
              im.save(f[:-4] + '.jpg', quality=70); os.remove(f)
          PY
          sed -i 's/\.png"/.jpg"/g' visual-audit/relatorio.json
          branch="qa-audit/run-${{ github.run_id }}"
          cd visual-audit
          git init -q -b "$branch"
          git config user.name "jynlo-qa-bot"; git config user.email "qa-bot@users.noreply.github.com"
          git add -A && git commit -qm "Auditoria visual ${{ github.run_id }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$branch"
          echo "::notice::Resultados no ramo $branch"
