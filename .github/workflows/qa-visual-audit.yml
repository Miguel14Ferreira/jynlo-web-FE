name: Jynlo auditoria visual (manual, conta QA, só leitura)

# Percorre as páginas principais do site real com a conta QA jynloteste01, em
# telemóvel e computador, e guarda capturas + relatório de problemas de layout.
# Só leitura: não envia mensagens, não submete formulários nem muda dados.
# As capturas mostram apenas o que a conta QA vê e ficam 5 dias no artefacto privado.
on:
  workflow_dispatch:
    inputs:
      conta:
        description: 'Conta (0 = visitante sem sessão, 1 = jynloteste01 dono, 2 = jynloteste02 membro)'
        type: choice
        options: ['0', '1', '2']
        default: '1'
      idioma:
        description: 'Idioma do site'
        type: choice
        options: [pt, en]
        default: pt

permissions:
  contents: write

concurrency:
  group: jynlo-visual-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
      JYNLO_AUDIT_ACCOUNT: ${{ inputs.conta || '1' }}
      JYNLO_AUDIT_LANG: ${{ inputs.idioma || 'pt' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar conta QA autorizada
        run: |
          acc="$JYNLO_AUDIT_ACCOUNT"; [ "$acc" = 0 ] && acc=1
          u="JYNLO_QA_USERNAME_$acc"; p="JYNLO_QA_PASSWORD_$acc"
          if [ -z "${!p}" ] || [ "${!u}" != "jynloteste0$acc" ]; then
            echo '::error::Conta QA em falta ou não autorizada; nenhuma sessão iniciada.'; exit 1
          fi
      - name: Instalar Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund --package-lock=false playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Auditoria
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/qa/visual-audit.cjs
      - name: Guardar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jynlo-auditoria-visual
          path: visual-audit/
          retention-days: 5
      # Results stay in the run (log + artifact): never create branches (only develop/master exist).
      - name: Resumo no registo
        if: always()
        run: |
          [ -f visual-audit/relatorio.json ] || exit 0
          node -e '
            const r = require("./visual-audit/relatorio.json");
            const lines = [];
            for (const p of r) for (const pr of (p.problemas || []))
              lines.push([p.ecra, p.pagina, pr.tipo, String(pr.detalhe || "").slice(0, 160)].join(" | "));
            console.log("QA-RESUMO paginas=" + r.length + " problemas=" + lines.length);
            for (const l of lines) console.log("QA-PROBLEMA " + l);
          ' | tee -a "$GITHUB_STEP_SUMMARY"
