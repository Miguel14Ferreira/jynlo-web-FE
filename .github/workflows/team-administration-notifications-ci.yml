name: Jynlo team administration notifications UI CI
on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

permissions:
  contents: read
jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Test notification inbox actions in isolation
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/notifications/notifications.component.spec.ts
      - name: Test tournament administration views in isolation
        if: always()
        run: npm test -- --watch=false --browsers=ChromeHeadless --include=src/app/pages/communities/community-tournaments.component.spec.ts --include=src/app/pages/communities/community-tournament-capabilities.spec.ts
      - name: Validate production compilation independently of test regressions
        if: always()
        run: npm run build
