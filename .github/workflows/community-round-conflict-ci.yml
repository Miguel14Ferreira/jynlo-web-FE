name: Jynlo community round conflict regression

on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-conflict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate community round regression tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --include=src/app/pages/communities/communities.component.spec.ts
      - name: Validate championship creation localization tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --include=src/app/pages/communities/community-tournaments.component.spec.ts
