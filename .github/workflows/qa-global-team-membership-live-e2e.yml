name: Jynlo QA - LIVE two-account permanent-team membership (cleanup)

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/qa-global-team-membership-live-e2e.yml'
      - 'scripts/qa/jynlo-global-team-membership-live-e2e.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-qa-permanent-team-e2e-once
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated live QA script syntax
        run: node --check scripts/qa/jynlo-global-team-membership-live-e2e.cjs

  live-membership:
    needs: preflight
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'qa(global-team): execute isolated one-shot membership'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      JYNLO_QA_GLOBAL_TEAM_ONCE: DISPOSABLE_QA_ONLY
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight API safe-delete before creating any QA team
        run: node scripts/qa/jynlo-global-team-membership-live-e2e.cjs
