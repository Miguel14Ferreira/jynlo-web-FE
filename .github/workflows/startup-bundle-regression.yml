name: Jynlo startup and bundle budget

on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel this short validation when another contributor updates team
# or tournament pages. Each run validates the exact triggering commit.
jobs:
  startup-build:
    name: Test app boot and enforce production initial-bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test splash, optional telemetry and login navigation
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npx ng test --watch=false --browsers=ChromeHeadless --include=src/app/app.component.spec.ts
      - name: Production build with existing strict bundle budgets
        run: npm run build
