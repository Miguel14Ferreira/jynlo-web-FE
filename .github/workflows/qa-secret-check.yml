name: QA - verificar secrets da conta de teste (sem login)
on:
  workflow_dispatch:
    inputs:
      login:
        description: "Também tentar 1 login da conta 1 pela API (mostra só o código e a mensagem do servidor)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar formato (nunca mostra valores nem faz login)
        env:
          U1: ${{ secrets.JYNLO_QA1_USERNAME }}
          P1: ${{ secrets.JYNLO_QA1_PASSWORD }}
          U2: ${{ secrets.JYNLO_QA2_USERNAME }}
          P2: ${{ secrets.JYNLO_QA2_PASSWORD }}
        run: |
          node -e '
            const chk = (n, u, p) => {
              const r = [];
              r.push(n + ": utilizador " + (u ? (u === u.trim() ? "sem espaços nas pontas" : "TEM espaços/quebras nas pontas") : "VAZIO"));
              if (n === "QA1") r.push(n + ": utilizador é exatamente jynloteste01? " + (u === "jynloteste01"));
              if (n === "QA2") r.push(n + ": utilizador é exatamente jynloteste02? " + (u === "jynloteste02"));
              r.push(n + ": palavra-passe " + (p ? p.length + " caracteres, " + (p === p.trim() ? "sem espaços nas pontas" : "TEM espaços/quebras nas pontas") + (/[\r\n]/.test(p) ? ", TEM quebra de linha" : "") : "VAZIA"));
              return r;
            };
            for (const l of [...chk("QA1", process.env.U1, process.env.P1), ...chk("QA2", process.env.U2, process.env.P2)]) console.log("QA-SECRET " + l);
          '
      - name: Um login pela API (só código e mensagem do servidor)
        if: inputs.login
        env:
          U1: ${{ secrets.JYNLO_QA1_USERNAME }}
          P1: ${{ secrets.JYNLO_QA1_PASSWORD }}
        run: |
          node -e '
            (async () => {
              for (const api of ["https://api.jynlosports.com"]) {
                const r = await fetch(api + "/api/auth/login", { method: "POST",
                  headers: { "Content-Type": "application/json", Accept: "application/json" },
                  body: JSON.stringify({ username: process.env.U1, password: process.env.P1 }) });
                let msg = ""; try { const j = await r.json(); msg = j.message || j.error || (j.token ? "token recebido" : JSON.stringify(Object.keys(j))); } catch {}
                console.log("QA-LOGIN " + api + " HTTP " + r.status + " " + String(msg).slice(0, 160));
              }
            })();
          '
