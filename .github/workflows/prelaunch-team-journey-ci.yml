name: Jynlo web prelaunch team journey

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/prelaunch-team-journey-ci.yml'
      - 'src/app/pages/communities/community-tournaments.component.ts'
      - 'src/app/pages/communities/community-tournaments.component.html'
      - 'src/app/pages/communities/competition-team-search.component.ts'
      - 'src/app/pages/communities/global-team-enrollment.component.ts'
      - 'src/app/pages/communities/community-team-journey.ts'
      - 'src/app/pages/sports-teams/sports-teams.component.ts'
      - 'src/app/services/team-competition-enrollments.service.ts'
      - 'src/app/services/team-competition-invitations.service.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Compile web team creation, competition invitation, enrollment and honours UI
        run: npm run build
