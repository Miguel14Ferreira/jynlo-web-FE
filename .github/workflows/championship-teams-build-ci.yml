name: Jynlo championship teams build CI
on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Compile Angular production build separately from unrelated session tests
        run: npm run build
