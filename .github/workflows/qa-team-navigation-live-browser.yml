name: Jynlo QA - authenticated team navigation and loading (read-only)

on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jynlo-qa-team-navigation-browser
  cancel-in-progress: false

jobs:
  browser-qa:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'qa(web-teams): execute two-account navigation smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 11
    env:
      JYNLO_QA_TEAMS_BROWSER: READ_ONLY
      JYNLO_QA_USERNAME_1: ${{ secrets.JYNLO_QA1_USERNAME }}
      JYNLO_QA_USERNAME_2: ${{ secrets.JYNLO_QA2_USERNAME }}
      JYNLO_QA_PASSWORD_1: ${{ secrets.JYNLO_QA1_PASSWORD }}
      JYNLO_QA_PASSWORD_2: ${{ secrets.JYNLO_QA2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser QA source
        run: node --check scripts/qa/jynlo-team-navigation-live-browser.cjs
      - name: Install pinned Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/jynlo-browser" --no-save --no-audit --no-fund --package-lock=false playwright@1.64.1
          timeout 180 "$RUNNER_TEMP/jynlo-browser/node_modules/.bin/playwright" install chromium --only-shell
      - name: Audit account teams, competition UI and navigation
        shell: bash
        run: NODE_PATH="$RUNNER_TEMP/jynlo-browser/node_modules" node scripts/qa/jynlo-team-navigation-live-browser.cjs
