name: Jynlo Airsoft develop validation

on:
  # Só manual, para poupar minutos do GitHub Actions; o Feature CI cobre cada push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airsoft-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Airsoft regressions and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete Angular regression suite
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Build production frontend
        run: npm run build
