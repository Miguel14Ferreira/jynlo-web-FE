@if (pollAvailable) {
  <button type="button" class="inbox-share-menu-poll" (click)="pollRequested.emit()">
    📊 {{ 'chat.poll.menu' | t }}
  </button>
}
@if (callUpAvailable) {
  <button type="button" class="inbox-share-menu-callup" (click)="callUpRequested.emit()">
    📣 {{ 'chat.callUp.menu' | t }}
  </button>
}
<button type="button" [disabled]="!attachmentControlsReady"
                          (click)="fileRequested.emit()">
                          📄 {{ 'chat.shareFile' | t }}
                        </button>
                        <button type="button" (click)="shareRequested.emit()">
                          ↗ {{ 'chat.shareJynlo' | t }}
                        </button>
