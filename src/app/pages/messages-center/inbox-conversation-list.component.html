<div class="inbox-entries">
            @if (sentRequests.length) {
              <button type="button" class="inbox-sent-toggle" [attr.aria-expanded]="sentOpen" (click)="toggleSent()">
                <span>{{ 'Pedidos que enviaste' | t }} <span class="inbox-sent-count">{{ sentRequests.length }}</span></span>
                <svg [class.is-open]="sentOpen" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
            }
            @for (s of (sentOpen ? sentRequests : []); track s.id) {
              <button type="button" class="inbox-entry inbox-entry--request" (click)="sentSelected.emit(s.username)">
                <span class="inbox-avatar" aria-hidden="true">
                  @if (s.profilePicUrl && !failedAvatars.has('req:' + s.username)) {
                    <img class="inbox-avatar-image" [src]="s.profilePicUrl" alt="" loading="lazy" referrerpolicy="no-referrer"
                      (error)="failedAvatars.add('req:' + s.username)">
                  } @else { {{ s.username.slice(0, 1).toUpperCase() }} }
                </span>
                <span class="inbox-entry-content">
                  <span class="inbox-entry-top">
                    <strong>&#64;{{ s.username }}</strong>
                  </span>
                  <span class="inbox-entry-kind">{{ 'Pedido enviado' | t }}</span>
                  <span class="inbox-entry-snippet">{{ 'Tu' | t }}: {{ s.text }}</span>
                </span>
              </button>
            }
            @for (conversation of conversations; track conversation.key) {
              <button type="button" class="inbox-entry"
                [class.is-selected]="selectedKey === conversation.key"
                [attr.aria-pressed]="selectedKey === conversation.key"
                (click)="conversationSelected.emit(conversation)">
                <span class="inbox-avatar" [class.inbox-avatar--community]="conversation.kind === 'community'"
                  [class.inbox-avatar--session]="conversation.kind === 'session'" aria-hidden="true">
                  @if (conversation.avatarUrl && !failedAvatars.has(conversation.key)) {
                    <img class="inbox-avatar-image" [src]="conversation.avatarUrl" alt=""
                      loading="lazy" referrerpolicy="no-referrer"
                      (error)="failedAvatars.add(conversation.key)">
                  } @else {
                    {{ conversation.kind === 'direct' ? conversation.title.slice(0, 1).toUpperCase() : conversation.kind === 'community' ? '👥' : conversation.kind === 'team' ? conversation.title.slice(0, 1).toUpperCase() : '⚽' }}
                  }
                </span>
                <span class="inbox-entry-content">
                  <span class="inbox-entry-top">
                    <strong>{{ conversation.title }}</strong>
                    @if (conversation.latestAt) { <small [attr.title]="formatters.date(conversation.latestAt)">{{ formatters.time(conversation.latestAt) }}</small> }
                  </span>
                  <span class="inbox-entry-kind">{{ formatters.kind(conversation.kind) | t }} · {{ conversation.subtitle }}</span>
                  <span class="inbox-entry-snippet">{{ conversation.latestText ? formatters.preview(conversation.latestText) : ('inbox.openPreview' | t) }}</span>
                </span>
                @if ((conversation.unreadCount ?? conversation.newThisVisit) > 0) {
                  <span class="inbox-unread" [attr.aria-label]="'inbox.newCount' | t:{count: (conversation.unreadCount ?? conversation.newThisVisit)}">
                    {{ formatters.unread(conversation) }}
                  </span>
                }
              </button>
            }
          </div>
